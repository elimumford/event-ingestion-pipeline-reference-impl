services:
  sqs:
    image: softwaremill/elasticmq-native:latest
    container_name: sqs-emulator
    restart: unless-stopped
    ports:
      - "9324:9324" # SQS REST endpoint
      - "9325:9325" # Optional Web UI
    environment:
      # Ensures ElasticMQ generates URLs matching your workstation's perspective
      - ELASTICMQ_NODE_ADDRESS_PORT=9324
      - ELASTICMQ_NODE_ADDRESS_HOST=localhost
